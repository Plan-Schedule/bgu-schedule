name: Update course catalogue

on:
  schedule:
    - cron: '17 3 * * *' # every day, 06:17 Israel time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-catalogue
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test scraper/test/*.test.mjs test/*.test.mjs
      - name: Scrape
        run: |
          grep -v '^#' scraper/semesters.txt | while read -r year sem; do
            [ -n "$year" ] && node scraper/scrape.mjs --year "$year" --sem "$sem"
          done
      - name: Commit changes
        run: |
          git config user.name "catalogue-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update course catalogue $(date -u +%F)"
            git push
          fi
