name: Update course catalogue

on:
  schedule:
    - cron: '17 3 * * *' # every day, 06:17 Israel time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-catalogue
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test scraper/test/*.test.mjs test/*.test.mjs
      - name: Scrape
        # One semester failing (the university site is sometimes unreachable) keeps
        # yesterday's data for it and doesn't stop the others. The run only fails
        # when nothing could be downloaded, which usually means the site changed.
        run: |
          ok=0; failed=0
          while read -r year sem mode; do
            [ -z "$year" ] && continue
            if node scraper/scrape.mjs --year "$year" --sem "$sem" ${mode:+--$mode}; then
              ok=$((ok + 1))
            else
              failed=$((failed + 1)); echo "::warning::$year-$sem could not be updated"
            fi
          done < <(grep -v '^#' scraper/semesters.txt)
          echo "updated: $ok, failed: $failed"
          [ "$ok" -gt 0 ]
      - name: Commit changes
        run: |
          git config user.name "catalogue-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update course catalogue $(date -u +%F)"
            # code may have been pushed while the scrape ran; data/ is only written here, so a rebase is safe
            for i in 1 2 3; do
              git pull --rebase --quiet origin main && git push && exit 0
              sleep $((i * 10))
            done
            exit 1
          fi
