<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <h1>מתכנן מערכת שעות</h1>
          <p class="sub"><span class="uni">אוניברסיטת בן-גוריון · </span><select id="year" aria-label="שנת לימודים"></select> <select id="sem" aria-label="סמסטר"></select></p>
        </div>
      </div>
      <div class="row" style="gap:6px;flex-wrap:nowrap">
        <a class="icon-btn" data-feedback target="_blank" rel="noopener" aria-label="יש לי הערה" title="יש לי הערה">💬</a>
        <button class="icon-btn" data-action="settings" aria-label="שמירת נתונים והגדרות" title="שמירת נתונים והגדרות">⚙︎</button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="courses"><span class="tab-ico">📚</span><span>קורסים</span></button>
      <button role="tab" data-tab="constraints"><span class="tab-ico">🗓️</span><span>אילוצים</span></button>
      <button role="tab" data-tab="results"><span class="tab-ico">✨</span><span>הצעות</span></button>
      <button role="tab" data-tab="plans"><span class="tab-ico">⭐</span><span>המערכות שלי</span></button>
    </nav>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="foot">
    <p><b>כלי עצמאי של סטודנטים, לא אתר רשמי של אוניברסיטת בן-גוריון.</b> אין לנו קשר לאוניברסיטה, והיא לא אחראית לו.</p>
    <p><a href="about.html">אודות, פרטיות ותנאי שימוש</a> · <a data-feedback target="_blank" rel="noopener">יש לי הערה</a> · <a href="about.html#accessibility">נגישות</a></p>
  </footer>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet-card" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
